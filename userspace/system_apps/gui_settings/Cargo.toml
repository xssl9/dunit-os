# DWM settings client for the M4 userspace DWM (Stack B), slice C.
#
# A gui-v1 client (same capability + wire path as gui_files) that edits the live
# DWM config: it loads `dwm_settings::Settings`, renders clickable swatches /
# steppers / toggles through the M4 UI Runtime (DUI + DSS + TTF), and on every
# change writes the config back via `dwm_settings::save` and pings the compositor
# to reload — the GUI<->TOML round-trip the concept calls for. RAM-only this
# session (disk persistence is DunitFS v2 / M5).
[package]
name = "gui_settings"
version = "0.1.0"
edition = "2021"

[dependencies]
libdunit = { path = "../../libdunit" }
gui_protocol_v1 = { path = "../../../protocols/gui-v1" }
dwm_settings = { path = "../../dwm_settings" }
dunit_style = { path = "../../../runtime/dunit-style" }
dunit_text = { path = "../../../runtime/dunit-text" }
dunit_render = { path = "../../../runtime/dunit-render" }

[[bin]]
name = "gui_settings"
path = "src/main.rs"
