# Dunit DWM per-app config — gui_terminal.
#
# Loaded by the terminal at start from /system/share/dwm/apps/gui_terminal.toml
# (embedded in the kernel MemFS, writable). A missing/unparseable file falls
# back to the terminal's built-in Green Tea palette (last-known-good baseline).
# Unknown keys are ignored for forward compatibility.
#
# Colors are #RRGGBB or #AARRGGBB (alpha defaults to opaque).

[terminal]
# Shell prompt handed to `dsh` via the PROMPT env var.
prompt      = "dsh"
# TrueType font path; empty inherits the desktop `[desktop] font`.
font        = ""
# Default foreground and background (the live `fg` is mutated by SGR / ESC[…m).
fg          = "#A6E3A1"
bg          = "#0B0F14"
# Background opacity 0-255. 255 keeps the opaque XRGB fast path; a lower value
# requests a translucent ARGB backdrop (wallpaper shows through, text stays crisp).
bg_alpha    = 210
# The 8 ANSI colors (SGR 30-37) and their bright variants (SGR 90-97).
ansi        = ["#45475A", "#F38BA8", "#A6E3A1", "#F9E2AF", "#89B4FA", "#CBA6F7", "#94E2D5", "#CDD6F4"]
ansi_bright = ["#585B70", "#EBA0AC", "#A6E3A1", "#FAB387", "#89DCEB", "#F5C2E7", "#94E2D5", "#FFFFFF"]
